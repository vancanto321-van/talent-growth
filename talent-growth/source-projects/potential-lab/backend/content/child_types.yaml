# 儿童类型培养方案：8 个类型对应 8 个观察维度（孩子最高分维度 = TA 的类型）。
# 每个类型包含：日常表现 / 培养总则 / 4 周月度培养计划（每周主题+3 个活动+家长要点）/ 避坑提醒 / 资源建议。
# 活动默认适配 3-12 岁，个别地方用（3-6岁：… / 7-12岁：…）区分。
#
# 定位声明：类型描述的是"当下的兴趣与行为倾向"，不是定性的标签——孩子会变，
# 建议每 3-6 个月重测一次观察孩子的变化。

types:
  - trait: linguistic
    type_name: 语言小达人
    headline: 爱听爱说爱编故事，语言就是 TA 的游乐场
    signature:
      - 词汇量大，爱用新学到的词
      - 听完故事能绘声绘色地复述甚至改编
      - 喜欢问字、认字、给玩偶讲故事
    principles:
      - 大量输入：每天固定的亲子阅读时间，读完聊"如果是你会怎么办"
      - 大量输出：让 TA 讲给你听——复述、编故事、当小老师，讲完具体夸细节
      - 把"说"变成"作品"：录音小故事、自制绘本，让语言留下看得见的东西
    weekly_plan:
      - week: 第 1 周
        theme: 故事输入周
        activities:
          - 每天睡前共读 15-20 分钟，读后互相提一个问题
          - 3-6 岁：玩"故事接龙"，你一句我一句；7-12 岁：让孩子给故事换个结局
          - 去一次图书馆或书店，让孩子自己挑一本感兴趣的书
        parent_tip: 本周只做一件事——听 TA 说，不打断、不纠错。
      - week: 第 2 周
        theme: 表达输出周
        activities:
          - 让孩子把最喜欢的一个故事讲给另一位家人听
          - 用手机录一段"小主播时间"（3 分钟讲今天的开心事）
          - 3-6 岁：玩偶剧场演一个故事；7-12 岁：写/画一个 4 格小漫画
        parent_tip: 录像回放时先说两个优点，再问"你自己想改哪里"。
      - week: 第 3 周
        theme: 语言游戏周
        activities:
          - 玩词语接龙、反义词对对碰、猜谜语
          - 3-6 岁：儿歌童谣跟唱；7-12 岁：学一首古诗并讲给家人听意思
          - 逛超市/公园时玩"描述一样东西让对方猜"
        parent_tip: 游戏里让孩子赢 60% 的次数，保持"语言=好玩"的感觉。
      - week: 第 4 周
        theme: 小小作品周
        activities:
          - 把本月录的故事整理成"孩子电台第 1 期"放给全家听
          - 自制一本小绘本或小书（画+口述，家长帮忙写字）
          - 让孩子给下一个想要的故事主题做主
        parent_tip: 月底回顾时问孩子"这个月你发现自己哪里变厉害了"。
    pitfalls:
      - 别急着纠正发音和错别字，先保护表达的欲望
      - 别拿"别人家孩子更会说话"比较，语言型孩子也各有节奏
      - 别只囤书不共读，输入必须配输出
    resources:
      - 3-6 岁：《猜猜我有多爱你》《大卫不可以》等经典绘本
      - 7-12 岁：《长袜子皮皮》、成语故事、儿童版新闻播客
      - 工具：手机录音/简单剪辑 App（做"孩子电台"）

  - trait: logical
    type_name: 逻辑小侦探
    headline: 什么都要问为什么，规则和规律让 TA 着迷
    signature:
      - 连环追问"为什么"，直到得到解释
      - 拼图、棋类、找规律游戏明显占优
      - 做事讲顺序，发现"不对劲"特别快
    principles:
      - 少给答案，多给追问："你觉得呢？我们怎么验证？"
      - 把生活变成谜题：做饭（计量）、购物（比价）、出门（路线规划）都是思维训练
      - 容许"聪明的失败"：试错的过程比正确答案更值得表扬
    weekly_plan:
      - week: 第 1 周
        theme: 提问探测周
        activities:
          - 准备一个"为什么笔记本"，孩子每问一个为什么就记下来，周末一起挑一个查答案
          - 玩"猜猜我在想什么"（通过是/否提问缩小范围）
          - 3-6 岁：按大小/颜色/形状给玩具分类；7-12 岁：整理书架并说出分类规则
        parent_tip: 不知道答案就一起查，示范"怎么找答案"比答案本身重要。
      - week: 第 2 周
        theme: 动手验证周
        activities:
          - 做一个家庭小实验（沉浮、影子长短、豆子发芽）
          - 3-6 岁：比较两杯水哪个多并说理由；7-12 岁：测量并记录一周气温
          - 玩一次完整的桌游，结束后复盘"哪一步走对了"
        parent_tip: 让孩子先预测结果再动手，对比"猜的"和"真的"。
      - week: 第 3 周
        theme: 策略对局周
        activities:
          - 学一样新棋类或策略卡牌（跳棋/五子棋/ UNO）
          - 3-6 岁：玩"寻找宝藏"按 3 个线索找东西；7-12 岁：给孩子 20 元预算列购物清单
          - 让孩子教你一个规则简单的游戏
        parent_tip: 输赢都复盘过程；孩子赢了别让棋，教"怎么赢"。
      - week: 第 4 周
        theme: 小小研究员周
        activities:
          - 让孩子围绕自己的"为什么笔记本"选一个问题做展示（画/讲/演都行）
          - 数学生活化：算全家一周喝几瓶水、分披萨怎么切公平
          - 3-6 岁：玩测量游戏（用脚步量房间）；7-12 岁：做一次简单的统计（全家爱吃的水果）
        parent_tip: 展示时全家当观众，认真提问一个问题。
    pitfalls:
      - 别用"哪来那么多为什么"打发提问，那是天赋的火苗
      - 别代替孩子得出答案，卡住时给提示不给结论
      - 别把刷题当思维训练，真实问题更能喂饱这类孩子
    resources:
      - 3-6 岁：《神奇校车》图画书、磁性拼图、简单积木
      - 7-12 岁：《可怕的科学》系列、数独、编程启蒙（ScratchJr/Scratch）
      - 工具：卷尺、放大镜、一个"为什么笔记本"

  - trait: spatial
    type_name: 空间建筑师
    headline: 眼里有结构，手里有作品，空间就是 TA 的语言
    signature:
      - 拼搭、画画有想法，能搭出"像样"的结构
      - 认路、拼图、看图找东西特别快
      - 喜欢拆装，对形状颜色敏感
    principles:
      - 给足材料：积木、纸箱、画笔、黏土，宁少玩具多材料
      - 从"模仿"到"设计"：先临摹再创作，每幅作品请 TA 讲设计思路
      - 空间语言日常化：多用"上面/左转/斜对面"这类方位词交流
    weekly_plan:
      - week: 第 1 周
        theme: 搭建入门周
        activities:
          - 用积木/纸箱自由搭建，主题：我的家
          - 3-6 岁：模仿图片搭一个高塔；7-12 岁：挑战用一张 A4 纸搭出能放 3 支笔的架子
          - 一起拼一幅拼图，观察孩子的策略
        parent_tip: 过程不指挥，完成后请孩子当"导游"介绍作品。
      - week: 第 2 周
        theme: 绘画观察周
        activities:
          - 写生：画桌上的一组水果或窗外景色
          - 3-6 岁：玩"找不同"图画书；7-12 岁：学一招简单透视（近大远小）
          - 用不同材料再画一次同一主题（手指画/水彩/剪贴）
        parent_tip: 夸具体细节（"这个屋顶的斜度有意思"），不夸"画得真像"。
      - week: 第 3 周
        theme: 空间游戏周
        activities:
          - 玩寻宝游戏：让孩子画一张家里的藏宝图，你来按图找
          - 3-6 岁：七巧板拼出指定图形；7-12 岁：折纸挑战（纸飞机/盒子）
          - 出门玩时让孩子负责看地图/路标带路一段
        parent_tip: 让孩子带路时忍住指路的冲动，走错也是空间学习。
      - week: 第 4 周
        theme: 小小设计师周
        activities:
          - 设计"梦想房间"：画平面图 + 讲解布局理由
          - 3-6 岁：用黏土做一个自己设计的"建筑"；7-12 岁：用废旧纸箱做一个功能模型（笔筒/收纳盒）
          - 办一场"家庭作品展"，邀请家人参观打分
        parent_tip: 展览时挂上作品名和作者名牌，仪式感就是最好的鼓励。
    pitfalls:
      - 别按"像不像"评价孩子的画，空间型孩子重在结构与想法
      - 别把拆东西一律当破坏，先问"你想研究什么"
      - 材料别太"成品化"（按按钮就动的玩具），越素越好
    resources:
      - 3-6 岁：大颗粒积木、七巧板、手指画颜料
      - 7-12 岁：乐高经典颗粒盒、折纸书、SketchUp/建模启蒙 App
      - 工具：安全剪刀、胶带、一箱"废纸箱"

  - trait: musical
    type_name: 音乐小精灵
    headline: 旋律一响身体就动，音乐是 TA 的母语
    signature:
      - 听两遍就能哼出旋律
      - 唱歌音准节奏都不错
      - 对乐器好奇，对"跑调"敏感
    principles:
      - 先"泡"再"学"：家里有音乐氛围比马上报班重要
      - 多听多唱多动，识谱和乐器放在兴趣稳固之后
      - 提供真实的声音体验：现场演出、不同风格的音乐都给 TA 听
    weekly_plan:
      - week: 第 1 周
        theme: 音乐环境周
        activities:
          - 每天固定"音乐时间"（早餐/傍晚），放不同风格（古典/民谣/儿歌/世界音乐）
          - 3-6 岁：跟着音乐自由跳舞；7-12 岁：听三首曲子说出喜欢哪首、为什么
          - 一起看一段乐器演奏短视频，让孩子挑"最想试"的乐器
        parent_tip: 本周观察孩子对哪种风格/节奏反应最强，记下来。
      - week: 第 2 周
        theme: 节奏身体周
        activities:
          - 拍手打节奏游戏：你拍一句 TA 学一句
          - 用家里物品做"打击乐"（锅、盒子、装豆子的瓶）
          - 3-6 岁：音乐木头人（音乐停就定住）；7-12 岁：跟节拍器走/慢走
        parent_tip: 节奏感比音准更基础，先玩节奏再谈唱歌。
      - week: 第 3 周
        theme: 声音探索周
        activities:
          - 学哼唱一首新歌的副歌部分，录下来对比原唱
          - 3-6 岁：猜声音游戏（闭眼听是什么声音）；7-12 岁：用免费 App 试弹一段旋律
          - 看一场线上或线下儿童音乐会
        parent_tip: 录音回放只做"哪里像、哪里不像"，不做"唱得不好"评价。
      - week: 第 4 周
        theme: 小小演出周
        activities:
          - 准备一个 3 分钟的"家庭演唱会"（唱+自制乐器伴奏）
          - 和孩子一起决定：要不要正式开始学一门乐器？学哪个？
          - 制作"我的歌单"：这个月最喜欢的前 5 首
        parent_tip: 是否报班让孩子参与决定；开始后前三个月重点保护兴趣。
    pitfalls:
      - 别一上来就考级和练琴打卡，兴趣先于技术
      - 别说"你唱歌不行"这类定性话，音准大部分可以练
      - 别只听儿歌，孩子的耳朵值得更丰富的音乐
    resources:
      - 3-6 岁：奥尔夫音乐游戏、小打击乐器套装
      - 7-12 岁：尤克里里/口风琴（入门友好）、音乐听辨 App
      - 工具：蓝牙音箱、一个"家庭歌单"

  - trait: bodily
    type_name: 身体小健将
    headline: 坐不住是小健将的天性，动够了才能学得好
    signature:
      - 跑跳攀爬样样来，精力旺盛
      - 学新动作快，身体协调
      - 精细动作也在线（剪、串、拼）
    principles:
      - 先放电再安静：运动量安排在学习和安静活动之前
      - 每天 1-2 小时户外是刚需，不是奖励
      - 让"动"多样：跑跳、攀爬、球类、轮滑、游泳轮着来，再选专项
    weekly_plan:
      - week: 第 1 周
        theme: 基础放电周
        activities:
          - 每天户外活动 60 分钟以上（公园、小区都行）
          - 3-6 岁：玩追跑、投掷、踢球；7-12 岁：跳绳 3 组，记录个数
          - 睡前拉伸或亲子瑜伽 10 分钟
        parent_tip: 记录孩子最兴奋的项目，这是后面选班的依据。
      - week: 第 2 周
        theme: 技能挑战周
        activities:
          - 学一个新动作（拍球/踢毽子/骑平衡车或自行车）
          - 3-6 岁：走平衡木（花坛边沿）+ 单脚站；7-12 岁：连续跳绳 30 个挑战
          - 家庭运动会：设 3 个小项目，全家参加
        parent_tip: 挑战难度设在"跳一跳够得着"，连败三次就降档。
      - week: 第 3 周
        theme: 团队规则周
        activities:
          - 参加一次集体体育游戏（和邻居孩子/亲子班）
          - 学一项有规则的运动入门（足球颠球/篮球运球/游泳课体验）
          - 3-6 岁：红绿灯游戏（听指令动/停）；7-12 岁：看一场比赛并讲规则
        parent_tip: 规则型运动练的是"输了也想再来"，比赢更重要。
      - week: 第 4 周
        theme: 专项体验周
        activities:
          - 体验 1-2 个正式课程（游泳/体操/球类），让孩子说说感受
          - 制定下月运动日历（每周固定 3 次运动时间）
          - 3-6 岁：亲子障碍赛（家里布置）；7-12 岁：给本月进步拍个对比视频
        parent_tip: 选班标准：教练会保护兴趣 > 教练名气。
    pitfalls:
      - 别把"坐不住"当缺点批评，那是能量不是错误
      - 别过早专项化（单一项目高强度），12 岁前广泛尝试更好
      - 别用零食当运动奖励，运动本身的爽感才是长期动力
    resources:
      - 3-6 岁：平衡车、大球、障碍物（家用软垫）
      - 7-12 岁：跳绳、轮滑/自行车、一项球类
      - 工具：运动手环（大孩子）、一张运动打卡日历

  - trait: interpersonal
    type_name: 人际小领袖
    headline: 天生会来事，人群里的"小胶水"
    signature:
      - 主动交朋友，很快和大家打成一片
      - 能察觉别人情绪，会安慰、会调解
      - 喜欢组织大家一起玩
    principles:
      - 给舞台也给边界：多创造 group 活动，同时教"别人的感受也是底线"
      - 把领导力往"服务"引：组织活动=让大家玩得开心，不是说了算
      - 家长示范：孩子的人际模板首先是看大人怎么说话待人
    weekly_plan:
      - week: 第 1 周
        theme: 情绪识别周
        activities:
          - 玩情绪猜猜看（表情/语气猜情绪）
          - 共读一本关于友情/情绪的绘本或故事，聊"他为什么难过"
          - 3-6 岁：教一句安慰的话并演练；7-12 岁：记录一天中观察到的两个人情绪
        parent_tip: 孩子调解同伴矛盾时先旁听，之后复盘"你哪里做得好"。
      - week: 第 2 周
        theme: 主动交友周
        activities:
          - 约一个不太熟的小伙伴一起玩，让孩子自己发出邀请
          - 教并演练 3 句"交友开场白"
          - 3-6 岁：分享游戏（轮流玩玩具）；7-12 岁：让孩子约同学一起完成小任务
        parent_tip: 被拒绝了就聊"下次换哪句话再试"，不做价值评判。
      - week: 第 3 周
        theme: 组织协调周
        activities:
          - 让孩子组织一次家庭小游戏之夜（选游戏、定规则、当主持）
          - 3-6 岁：给玩偶们"开会"分点心；7-12 岁：和同学一起完成一个小手工/学习任务
          - 复盘：谁没玩开心？下次怎么调整？
        parent_tip: 组织翻车了别接管，帮孩子把问题变成改进点。
      - week: 第 4 周
        theme: 小小服务周
        activities:
          - 做"家庭服务日"：孩子安排一项让全家开心的事（表演/游戏/点心）
          - 3-6 岁：给幼儿园/班上准备一个小分享；7-12 岁：参加一次社区志愿或帮助他人活动
          - 月度回顾：这个月交到/加深了哪个朋友的友谊
        parent_tip: 引导 TA 发现"让大家开心"本身是最好的领导力。
    pitfalls:
      - 别给孩子贴"滑头/自来熟"的负面标签，那是社交敏锐
      - 别强迫分享或强迫外向，边界的感受也要尊重
      - 别代替孩子处理所有冲突，他需要练习机会
    resources:
      - 3-6 岁：情绪卡片、角色扮演玩具（医生/厨房）
      - 7-12 岁：《朋友之间》类儿童社交书、桌游（合作类）
      - 工具：每周一次的"小伙伴日"

  - trait: intrapersonal
    type_name: 内省小思想家
    headline: 安静不等于慢热，TA 在心里把世界想了一遍
    signature:
      - 独处时自得其乐，专注安静活动
      - 对自己的优缺点有超出年龄的认识
      - 有主见，不轻易被带跑
    principles:
      - 尊重节奏：给 TA 独处和"慢热"的时间，不逼当场表演
      - 用一对一深聊代替人多场合的寒暄
      - 给思想找出口：日记、画画、和家长的"悄悄话时间"
    weekly_plan:
      - week: 第 1 周
        theme: 认识自己周
        activities:
          - 画"我的自画像"：周围写上 5 个形容自己的词
          - 3-6 岁：玩"我喜欢/我不喜欢"轮流说；7-12 岁：写三句"我是一个……的人"
          - 每晚睡前"今日高光时刻"分享（一人一条）
        parent_tip: TA 说的任何感受都先接住再讨论，不评判"这有什么好怕的"。
      - week: 第 2 周
        theme: 情绪智慧周
        activities:
          - 制作"情绪温度计"，每天给心情打个分并说原因
          - 读一个关于情绪的故事，讨论主人公还有什么办法
          - 3-6 岁：用颜色画出今天的心情；7-12 岁：写一篇 3 句话的"心情日记"
        parent_tip: 家长也分享自己的情绪管理经历，示范比说教有用。
      - week: 第 3 周
        theme: 独立思考周
        activities:
          - 抛一个开放问题（"如果一天有 30 小时会怎样"）让 TA 想一天再回答
          - 3-6 岁：给故事主角想 3 个办法；7-12 岁：就"该不该……"来一次家庭小辩论
          - 安排一次独处的"安静时光"（不被安排的活动）
        parent_tip: 答案不评价对错，追问"你是怎么想到的"。
      - week: 第 4 周
        theme: 小小计划周
        activities:
          - 让孩子给自己定一个下月小目标（自己选、自己定标准）
          - 一起做一个"我的习惯表"，孩子自己设计打分方式
          - 月度"悄悄话"：聊聊这个月 TA 对自己的新发现
        parent_tip: 目标完全由孩子定，家长只问"需要我帮什么"。
    pitfalls:
      - 别把内向当需要"治"的问题，逼外向只会消耗 TA
      - 别当众揭 TA 的短处（哪怕玩笑），内省的孩子记得久
      - 别用热闹量表衡量快乐，TA 在安静里发光
    resources:
      - 3-6 岁：情绪绘本（《我的情绪小怪兽》）、贴纸日记本
      - 7-12 岁：锁扣日记本、思维导图本、《儿童哲学启蒙》类读物
      - 工具：一个不被打扰的"秘密角落"

  - trait: naturalist
    type_name: 自然观察家
    headline: 眼里有虫鸣花草，观察是 TA 的超能力
    signature:
      - 对动物植物着迷，观察入微
      - 记名字厉害（恐龙、车标、花草）
      - 户外时专注度和兴奋度明显上升
    principles:
      - 把户外变成课堂：每周固定自然时间，观察-记录-提问三步走
      - 支持"收藏癖"：树叶、石头、昆虫图鉴，是 TA 的研究资料库
      - 从观察到爱护：养一颗植物或照顾一个小动物，学责任
    weekly_plan:
      - week: 第 1 周
        theme: 小区探险周
        activities:
          - 每天户外 30 分钟"探险"，找到 3 种没见过的东西
          - 3-6 岁：给发现的东西拍照并说特点；7-12 岁：开始"自然笔记本"（画+记）
          - 一起读一页图鉴，找出今天见到的物种
        parent_tip: 别急着报物种名，先问"你觉得它和什么像"。
      - week: 第 2 周
        theme: 养护责任周
        activities:
          - 认养一颗植物（或豆子发芽实验），由孩子负责浇水
          - 3-6 岁：每天观察并说一句变化；7-12 岁：做生长测量记录表
          - 去一次花鸟市场或植物园
        parent_tip: 忘浇水就让植物蔫一次，自然的后果是最好的老师。
      - week: 第 3 周
        theme: 分类收藏周
        activities:
          - 整理自然收藏盒：树叶/石头按自己的规则分类
          - 3-6 岁：玩"谁的脚印/叶子"配对游戏；7-12 岁：学做一件标本（压花/叶脉书签）
          - 看一集自然纪录片，找出和户外见到相似的行为
        parent_tip: 分类规则让孩子自己定，错分类也是思考。
      - week: 第 4 周
        theme: 小小博物家周
        activities:
          - 布置"家庭自然展"：收藏盒+笔记本+照片
          - 让孩子当导游，给全家讲一件本月最神奇的发现
          - 一起计划下个月的自然目的地（山/海边/湿地公园）
        parent_tip: 讲解时录下来，这就是 TA 的第一支"博物视频"。
    pitfalls:
      - 别嫌脏，玩泥巴和抓虫是天然的学习
      - 别只给塑料玩具，真实的自然材料信息量更大
      - 别用"危险"一刀切，教怎么安全地观察
    resources:
      - 3-6 岁：儿童放大镜、昆虫观察盒、自然贴纸书
      - 7-12 岁：《昆虫记》少儿版、本地植物/鸟类图鉴、双筒望远镜
      - 工具：一个自然收藏盒 + 观察笔记本

# 类型归属规则：8 个维度中得分最高者 = 当前类型（同分按维度顺序取先）。
# 毅力(grit)与思维模式(mindset)是"学习态度指标"，不参与类型判定，
# 但分数偏低时会在报告中给出对应的专项建议。
