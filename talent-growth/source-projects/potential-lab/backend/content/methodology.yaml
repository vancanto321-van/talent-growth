# 方法论说明：每个问卷的理论来源、计分方式、边界与参考文献。
# 前端「方法论」页直接渲染本文件；改这里即可更新产品内的科学说明。

version: 2026-10

# 科学边界：坦承式披露「能说明什么 / 不能说明什么」（参照技术报告的坦承呈现惯例）。
# 前端「科学边界」页直接渲染本结构；改这里即可更新产品内的科学边界声明。
science_boundary:
  intro: 在给出任何结论之前，先讲清楚这个产品的边界。这一页公开说明：我们的结论能说明什么、不能说明什么，以及什么情况下应当重测或寻求专业帮助。
  can_show:
  - 你自述里反复出现的行为线索——每条线索都附你的原话依据，可回溯、可在任务里验证。
  - 只和你自己比的变化：同难度任务成绩的变化、隔几天的迁移任务是否保持、继续意愿的起落——全部是个体之内比较。
  - 哪些方向值得优先投入小任务去验证——结论是行动优先级的排序，不是对「你是什么人」的判决或标签。
  - 一条可执行的培养路径：验证通过之后练什么、怎么练、每周投入多少时间。
  cannot_show:
  - 不能测出「先天天赋有多少」。单次对话或问卷无法区分先天潜力、后天经验与自我印象——这是测量方法本身的限制，任何宣称「一次测评看透天赋」的说法都不成立。
  - 不能替代医疗或心理咨询。本产品不是医疗或心理健康评估工具，不给出诊断式结论。如果你正处于持续的情绪困扰中，请寻求专业帮助（如全国心理援助热线 12356）。
  - 不能预测你未来的成就。进步只是值得继续探索的证据，不能自动归因于先天因素，也不能外推为对将来表现的保证。
  - 不能拿你和别人比较。我们没有同龄人常模数据，因此不提供任何「超过百分之多少的人」式结论；所有变化只相对你自己有意义。
  - 不能一次测完就下终身结论。所有结论描述的都是「当下的行为倾向」，会随经历变化；建议成人每 3-6 个月、儿童每 3 个月重测，重点看趋势而不是单次结果。
  - 不做「学习风格」类测评。「视觉型/听觉型学习者」按风格匹配教法的主张，在合格设计的实验里几乎没有得到支持（Pashler 等 2008 受托综述：未发现「风格×教法」交互，部分结果还相反）。人各有偏好≠按偏好施教更有效——别为这类测评花钱，本产品也不提供。
  disclaimer: 所有结论只基于你提供的信息与你在产品内的任务记录生成；证据不足时会如实标注「线索」或「待验证」。五维画像没有天赋分、没有名次，只呈现「你和过去的你」的证据链。

sections:
- id: principles
  icon: 🧭
  title: 方法论底线
  intro: 这四条原则决定了产品里每一个问题的设计方式。
  blocks:
  - heading: 为什么我们不给"天赋分"
    body: '单次问卷或 AI 对话无法区分先天潜力、已有经验和自我印象。 元分析研究（Macnamara 等, 2014）显示，刻意练习只能解释绩效方差的一部分 （体育 18%、音乐 21%、教育 4%、职业不足 1%）——练习重要但不是全部， 所以"进步"只能作为继续探索的证据，不能折算成一个天赋数字。

      '
  - heading: 为什么只和自己比
    body: '我们没有你的同龄人常模数据，任何"超过 95% 的人"的说法都是编造。 个体内比较（这次 vs 上次）才是有证据支撑的口径。

      '
  - heading: 为什么问具体经历，不问"你觉得自己怎么样"
    body: '行为事件访谈法（Flanagan 关键事件法 → McClelland 能力测评）的结论： 过去的真实行为对未来表现的预测力，显著高于抽象自我评价。 所以我们的问题是"哪件事、什么成果"，而不是"你是不是一个……的人"。

      '
  - heading: 为什么每条结论都带依据
    body: '评估研究报告里，回顾性自评的效度普遍偏弱，且问卷可能被社会赞许偏差污染。 因此线索必须引用你的原话，评估必须引用作品原文，证据不足时如实标注"线索"。

      '
- id: interview
  icon: 💬
  title: AI 探测访谈（6 题）
  intro: 理论基础：行为事件访谈法 + 关键事件法 + 心流理论。
  blocks:
  - heading: 题目结构
    body: '6 题分六类：学得顺的事（含基础量）、别人找你帮什么忙（含成果）、 愿意反复做的事、心流时刻、想试没试的、时间预算。 前两类用具体经历捕捉行为证据（行为事件访谈法）； 第三四类捕捉内在动机与心流（Csikszentmihalyi）； 第五类防止问卷只反映"过去的机会"；第六类只用于排计划的现实强度。

      '
  - heading: 怎么算分
    body: '模拟模式用信号词匹配方向；真实模式由大模型在提示词约束下抽取， 输出必须通过 JSON 结构校验。每条候选线索必须附"依据 + 原话引用"， 并自动标注"来自自述，需任务验证"。

      '
  - heading: 边界
    body: '访谈只能产生"线索"，不能产生结论。线索的证据等级永远是"线索"， 直到被真实任务验证。

      '
- id: industry
  icon: 🧪
  title: 行业潜力测评（48 题 / 12 特质 / 12 行业）
  intro: 理论基础：RIASEC 职业兴趣理论（Holland）+ 人-环境匹配理论 + 同伴参照自评。
  blocks:
  - heading: 12 个特质从哪来
    body: '以 Holland 的 RIASEC 六类型（现实/研究/艺术/社会/企业/常规）为骨架， 参照 O*NET Interest Profiler 的维度设计思路，扩展出更贴近 "可观察的日常行为"的 12 项：表达沟通、逻辑分析、审美创造、技术动手、 身体素质、精细操作、共情关怀、说服进取、统筹组织、抗压韧性、专注耐心、数字敏感。

      '
  - heading: 行业潜力分怎么算
    body: '每个行业有一组公开的特质权重（如外科医生=精细操作 30%+专注 20%+逻辑 20%…， 权重和为 1）。潜力分 = Σ(权重 × 特质分)，全部由程序计算。 这对应 Holland 理论里的"一致性（congruence）"概念：人与环境越匹配， 满意度和表现越好。

      '
  - heading: 反向题的作用
    body: '48 题里有 12 道反向计分题（答"非常像我"只得 1 分）。 它们有两个作用：抑制"一律说像我"的作答惯性；与正向题交叉验证特质是否真实。

      '
  - heading: 计分方式
    body: '特质分 = 该特质下所有题目的均分 × 20（Likert 1-5 作答，可得区间 20-100）。 每个特质 4 题，覆盖率高于单题判断；正式上线前需做小样本内部一致性检验。

      '
  - heading: 边界
    body: '自答问卷测的是"自我知觉的行为倾向"，不是能力测验。 潜力分高 = 值得优先用任务验证；潜力分低 = 入行要多跨一道坎，不代表不能做。

      '
- id: entry
  icon: 🧾
  title: 决定入行前，先核三件事
  intro: 行业潜力分只是「值得验证」的排序。真金白银投入之前，用这三件免费的事把决定做实（来源：人社部 2022 山寨证书专项治理、国家统计局分岗位工资、Frey & Osborne 2017）。
  blocks:
  - heading: 花钱考证，先查证从哪来
    body: >-
      报名前按三步查：这个职业在不在《国家职业资格目录》里；发证机构是不是人社部门备案的评价机构；证书编号能不能在官方技能人才评价证书平台查到。查不到的一律不报——带「国际」「高级」「注册」字样、承诺「包过」「挂靠有收入」的，风险最高。人社部 2022 年专项治理点名的乱象正是「以新职业、技能等级名义乱办班、乱收费、滥发证」。
  - heading: 「网上说工资高」不等于缺人
    body: >-
      招聘平台挂牌价和个人自述都不是行情：你能看到的多数是挣到钱的人，而且不算工时、通勤与淡旺季。官方口径有两个：国家统计局每年公布分岗位大类的年平均工资；各地人社局的培训补贴目录按急需紧缺程度定额度——补贴额度本身就是官方对「当地缺什么人」的定价，比传闻可靠。
  - heading: 挑技能看「要不要动手、要不要现场判断」
    body: >-
      对 702 个职业的可计算化评估（Frey & Osborne 2017）发现，机器最难替代的三道坎是：感知与操作（手上功夫、别扭姿势下的作业）、创造性智能、社会智能（跟人打交道）。所以需要到现场、面对非标准环境、靠临场判断的活更抗替代；流程固定、以信息处理为主的岗位风险最高。注意争议：该研究按整个职业估出的「约 47% 高风险」后来被按任务拆分的研究大幅下修——别盯着那个数字，看三道瓶颈。
- id: child
  icon: 🌈
  title: 儿童潜能观察问卷（48 题 / 8 维度 / 8 类型）
  intro: 理论基础：多元智能理论（哈佛 Gardner / Project Zero）+ 儿童观察评定传统 + 毅力与思维模式研究。
  blocks:
  - heading: 为什么用八个观察维度
    body: '参照加德纳多元智能理论的语言、逻辑、空间、音乐、身体、人际、内省、自然八个维度。 注意：加德纳官网明确"不存在加德纳认证的测评"——我们的题目是自编中文观察题， 不是官方量表，宣传上也不得使用"哈佛量表"字样。

      '
  - heading: 为什么分家长版和自答版
    body: '3-6 岁儿童的自评信度不足，采用家长观察版（家长评定是儿童评估的成熟传统， 如 SDQ 等量表均提供家长版）；7-12 岁提供自答版，建议家长陪同。

      '
  - heading: 毅力与思维模式
    body: '题库末尾的 8 题测"学习态度"：毅力（grit，宾大 Duckworth： 努力坚持 + 兴趣一致两要素）与成长型思维（斯坦福 Dweck）。 两者的原量表版权限非商用，故为按公开维度自行改写的中文题。 这两项不参与类型判定，分数偏低时给出专项养育建议。

      '
  - heading: 类型怎么定
    body: '最高分维度 = 当前类型（8 类）。类型描述的是"当下的兴趣与行为倾向"， 会随成长变化，建议 3-6 个月重测观察，而不是给孩子贴终身标签。

      '
- id: profile
  icon: 📊
  title: 五维画像与结业报告
  intro: 理论基础：刻意练习研究 + 测试效应 + 自我决定理论 + 多源反馈传统。
  blocks:
  - heading: 五个维度的理论出处
    body: '当前表现/学习进步——刻意练习框架（Ericsson）及其元分析修正（Macnamara）： 相近难度下的进步是最诚实的个体内信号； 迁移与保持——测试效应与间隔重复研究（Roediger & Karpicke；FSRS 算法）： 隔几天、换个题还会做，才算真的会； 持续意愿——自我决定理论（Deci & Ryan）：内在动机预测长期坚持； 证据充分度——多源反馈传统：自评之外引入真实读者的外部评价。

      '
  - heading: 判定规则是公开的
    body: '证据等级：完成 <2 次任务=线索；≥2 次=初步；≥3 次+独立完成≥4 分+有读者反馈=较充分。 结业判定的六档结论（继续投入→暂停验证）由同样公开的规则计算， AI 只负责把结论说得通顺，不参与判定。

      '
- id: practice
  icon: 🏋️
  title: 怎么练才有效
  intro: 培养路径里的「日常练习」为什么那样安排——练法本身有认知科学的证据等级（以下按效应量与证据分级取舍，来源见参考文献）。
  blocks:
  - heading: 合上书自测，胜过再读一遍
    body: >-
      222 项研究的元分析显示，课堂测验让学生成绩中等幅度提升（g≈0.50，Yang 等 2021）；十种常用学法的系统综述把「练习性测验」评为最高档（Dunlosky 等 2013）。读完一节先合上书默写要点、再翻回去对，有反馈更好。本产品让你提交作品并接受评价，本质就是把「考自己」做成了产品动作。
  - heading: 同样的时间，摊到几天
    body: >-
      汇总 317 个实验的元分析（Cepeda 等 2006）结论一致：分几次学比一次学完记得牢，且要保持得越久、最佳复习间隔越长。产品的「保持性重测」排在 7 天后并换变体任务，正是分散练习+变式提取的产品化。
  - heading: 该混着练的混着练
    body: >-
      交错练习元分析（59 项研究，g=0.42，Brunmair & Richter 2019）：需要「先判断这是哪类问题、该用哪个方法」的内容（数学题型、案例诊断、规则适用）混着练更有效；纯死记的内容（单词、名词解释）分块练反而更好。混着练当场正确率会变低、感觉像退步——这是正常代价。
  - heading: 划重点、反复读、写摘要不是主学法
    body: >-
      Dunlosky 等 2013 的评级里，这五种（含关键词记忆法、配图想象）都在最低档：不是完全没用，是起作用的条件太窄。划线可以用来标记「一会儿自测哪几处」，别把划线本身当成学习。
  - heading: 「按学习风格施教」没有证据
    body: >-
      受托评估该主张的综述（Pashler 等 2008）指出：证明它需要「按风格分组×随机分配教法×测交互作用」的设计，而合格研究几乎没有发现这种交互，部分结果还相反。人各有偏好≠按偏好施教更有效。别花钱做学习风格测评——本产品不做，也不建议任何人做（见科学边界页）。
  - heading: 按将来的用法出题考自己
    body: >-
      测试效应的迁移元分析（Pan & Rickard 2018，d=0.40）：自测的收益能迁移到新题型与应用题；迁移最弱的两种情况是「问答对调」和只见过没考过的内容。练之前先想清楚将来怎么用——要在卷子上选出来，还是要在现场判断出来——然后照那个形式出题，两个方向都练到。
- id: gamification
  icon: 🔥
  title: 游戏化为什么奖励这些
  intro: 理论基础：行为设计（Fogg）+ 自我决定理论，但有一条自己的红线。
  blocks:
  - heading: 只奖励验证行为
    body: '连击、XP、成就只发给"提交任务、自评、收集读者反馈、完成计划"这类验证动作， 永远不发给学生分数或"天赋值"。多邻国证明每日目标与连击能有效维持习惯， 但我们奖励的对象必须是让用户更了解自己的行为，而不是让数字好看的行为。

      '
  - heading: 连击断了怎么办
    body: '归零不是惩罚。研究显示自我原谅比自我批评更能恢复习惯， 所以断签后小潜会说"今天动一动就从 1 重新烧起来"。

      '
- id: faq
  icon: ❓
  title: 常见疑问
  intro: 用户最常问的五个问题，直接回答。
  blocks:
  - heading: 测出来的结果准不准？
    body: 问卷测的是『你自答的行为倾向』，不是能力测量。它的价值在于排序（哪个方向更值得先验证），不在于绝对分数。这就是为什么我们要求：结论必须用真实任务再验证一遍。
  - heading: 为什么有反向题？
    body: 反向题（答『非常像我』实际得低分）能发现不认真作答或过度美化的人。如果你正向题全勾『非常像我』、反向题也全勾，系统对这份结果的信任度会降低。
  - heading: 多久测一次合适？
    body: 成人行业测评建议每 3-6 个月一次（人是在变化的）；儿童观察问卷建议每 3 个月一次，重点看维度分数的变化趋势而不是单次结果。
  - heading: 孩子的类型会不会变？
    body: 会，而且应该变。7-12 岁正是兴趣剧烈探索期，类型变化是健康信号。我们刻意把报告写成『当下的倾向』而不是『你的定义』。
  - heading: 我的数据安全吗？
    body: 数据仅用于你自己的报告生成；我们不向第三方提供。儿童信息属敏感个人信息，需监护人操作；你可以要求删除全部数据（上线后的账号设置里提供入口）。
references:
- Flanagan, J. C. (1954). The Critical Incident Technique. Psychological Bulletin.
- McClelland, D. C. (1973). Testing for Competence Rather than for 'Intelligence'. American Psychologist.
- Spencer, L. M. & Spencer, S. M. (1993). Competence at Work（行为事件访谈法）.
- Holland, J. L. (1997). Making Vocational Choices（RIASEC 理论与人-环境匹配）.
- O*NET Interest Profiler（美国劳工部，CC BY 4.0 / GPL v3，维度结构参考）.
- Gardner, H. (1983/1999). Frames of Mind / Intelligence Reframed；Project Zero 注明无官方认证测评.
- Duckworth, A. L. et al. (2007/2009). Grit Scale（原量表商用需授权，本产品为自编改写题）.
- 'Dweck, C. S. (2006). Mindset: The New Psychology of Success.'
- Deci, E. L. & Ryan, R. M. (2000). Self-Determination Theory.
- Ericsson, K. A. et al. (1993). The Role of Deliberate Practice in the Acquisition of Expert Performance.
- 'Macnamara, B. N., Hambrick, D. Z. & Oswald, F. L. (2014). Deliberate Practice and Performance: A Meta-Analysis.'
- Roediger, H. L. & Karpicke, J. D. (2006). Test-Enhanced Learning（测试效应）.
- 'Csikszentmihalyi, M. (1990). Flow: The Psychology of Optimal Experience.'
- Ye, J. (2023→). FSRS 开源间隔重复算法（open-spaced-repetition）。
- 'Yang C, Luo L, Vadillo MA, Yu R, Shanks DR (2021). Testing (quizzing) boosts classroom learning: A systematic and meta-analytic review. Psychological Bulletin, 147(4).'
