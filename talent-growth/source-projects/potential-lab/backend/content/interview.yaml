# 探测访谈问题：一次 6 题，全部围绕「具体经历」而非自我评价。
# 设计原则（来自研究依据）：
# - 问「学得顺」+接触量，试图区分「有潜力」与「只是练得多」；
# - 问别人找你帮什么+具体成果，用外部事实校准自我印象；
# - 问遇挫后还想继续，探「持续意愿」；
# - 问想试没试的，给「新方向体验」留入口。
# signals 与 directions.yaml 保持一致（同一份信号表，避免模拟匹配与提示词分叉）。

questions:
- code: q_learn_fast
  category: 学得顺的事
  text: 最近一两年，哪些事情你学得比周围人快或更顺？接触它之前你有多少基础？
  hint: 举个例子，讲讲具体做过什么、花了多久上手。
- code: q_asked_for_help
  category: 别人找你帮什么
  text: 别人经常找你帮什么忙？有没有让你印象比较深的具体成果？
  hint: 家人、同学、同事都算；「成果」可以是别人的一句感谢或实际效果。
- code: q_repeat_willingly
  category: 愿意反复做的事
  text: 哪些活动你愿意反复做，遇到困难之后还想继续？卡住的时候你在想什么？
  hint: 越具体越好，比如「愿意为一句配色调一下午」。
- code: q_lose_track
  category: 心流时刻
  text: 做哪类事情时你会忘记时间？做完之后感觉是满足，还是只想躺着？
  hint: 回想最近一次「抬头发现天黑了」的经历。
- code: q_untried
  category: 想试没试的
  text: 有哪些你一直想尝试、但一直没有机会接触的方向？
  hint: 没接触过的也可以说，后面会安排低成本的体验任务。
- code: q_time_budget
  category: 投入预算
  text: 你现在的主要身份是什么？每周能稳定拿出多少时间做探索任务？
  hint: 如实估计就好，这决定计划强度，不影响方向判断。
