# 行业潜力图谱：每个行业 = 特质权重画像 + 培训路径 + 收入行情 + 线下自查任务。
# - weights 权重和为 1.0，潜力分 = Σ(权重 × 特质分)，全部由程序计算（模型不参与）；
# - income 为"行情参考"：entry 入行 / mid 成熟（3-5 年）/ top 头部（最好的市场行情），
#   单位为年收入（万元人民币），标注了分化与周期提示，正式上线前应更新为当期数据并注明来源；
# - direction_codes 关联线上验证方向（可生成线索进入 4 周周期）；为空表示线下验证为主。

industries:
- code: sales
  name: 销售 / 商务
  tagline: 把信任卖出去，把结果拿回来
  description: 面向客户成交：找线索、建信任、谈方案、拿回款。收入弹性极大，是最"看人"的行业之一。
  weights:
    persuasion: 0.25
    verbal: 0.2
    resilience: 0.2
    empathy: 0.15
    organization: 0.1
    numeric: 0.1
  training_path:
  - stage: 入门验证
    duration: 2 周
    actions:
    - 读一本经典销售书并给同事复述核心方法
    - 找 3 个真实机会完整谈一次（摆摊/二手转让/内推都算）
    - 记录每次被拒绝的场景和自己的反应
    checkpoint: 被拒绝 3 次后仍愿意开下一次口
  - stage: 基础训练
    duration: 1-3 个月
    actions:
    - 选定一个行业（软件/保险/教育皆可）吃透产品知识
    - 练一套 3 分钟开场和异议应对话术
    - 争取一份有提成机制的兼职或实习销售
    checkpoint: 独立完成 10 次以上真实客户沟通
  - stage: 进阶
    duration: 6-12 个月
    actions:
    - 从"卖产品"升级到"诊断客户问题"
    - 建立自己的客户档案与跟进节奏表
    - 找一位销冠师傅复盘你的谈判录音
    checkpoint: 有可复购或转介绍的客户
  - stage: 职业化
    duration: 1 年+
    actions:
    - 选定大客户/渠道/电销等细分赛道深耕
    - 把个人方法论写成团队可用的手册
    checkpoint: 业绩稳定进入团队前列
  income:
    entry: 8-15 万（底薪为主）
    mid: 20-50 万（提成占比过半）
    top: 80-300 万+（头部大客户销冠，含提成/奖金）
    note: 头部与中位数差距全行业最大之一；行情随所卖行业（软件/医美/金融）周期波动明显。
    source: 收入区间为 2025-2026 年主流招聘平台公开职位与行业报告的整理估算，随城市、公司和个人表现差异极大；上线前将替换为带出处的当期数据。
    as_of: 2026-09（估算基准，待按最新公开数据核实）
  self_checks:
  - 主动向 5 个陌生人介绍一件东西，记录自己开口前的紧张程度
  - 找一件对方本来不要的东西，尝试说服对方接受（合法合理范围内）
  - 连续 7 天跟进同一个潜在机会，观察自己是否中途放弃
  direction_codes:
  - expression
  - interpersonal
  requirements:
  - 学历要求宽松，重业绩与沟通实战
  - 无硬性证书；部分行业（保险/金融）需从业资格证
  - 建议：一份可验证的销售业绩记录比简历更有说服力
- code: athletics
  name: 竞技跑步 / 耐力运动
  tagline: 用身体输出结果，用年为单位积累
  description: 马拉松、越野、场地骑行等耐力项目。天赋（心肺、肌腱、恢复力）权重高，但训练体系决定上限。
  weights:
    physical: 0.5
    resilience: 0.2
    focus: 0.15
    organization: 0.1
    technical: 0.05
  training_path:
  - stage: 入门验证
    duration: 4 周
    actions:
    - 测一次 5 公里全力成绩作为基线
    - 连续 4 周每周 3 次轻松跑（心率控制在能说话的配速）
    - 记录晨脉和睡眠观察恢复能力
    checkpoint: 5 公里成绩明显进步且不受伤
  - stage: 基础训练
    duration: 3-6 个月
    actions:
    - 加入跑团接受规律间歇训练
    - 完成 10 公里或半马比赛
    - 学习心率区间和配速策略
    checkpoint: 半马完赛且配速稳定
  - stage: 进阶
    duration: 1-2 年
    actions:
    - 全马冲击年龄组名次
    - 引入力量训练与跑姿优化
    - 考虑田径协会注册或俱乐部试训
    checkpoint: 全马成绩达到地区业余精英水平
  - stage: 职业化
    duration: 2 年+
    actions:
    - 争取品牌赞助或体制内/俱乐部渠道
    - 以奖金+赞助+教练收入组合规划职业
    checkpoint: 比赛奖金或赞助覆盖生活成本
  income:
    entry: 基本是自费投入（报名、装备、恢复）
    mid: 10-40 万（业余精英：奖金+赞助+训练营）
    top: 100-500 万+（国家队级/头部马拉松运动员：赞助+奖金+商业活动）
    note: 呈极端金字塔分布，职业生涯短（耐力项目巅峰期约 10 年），需要尽早规划转型（教练/自媒体）。
    source: 收入区间为 2025-2026 年主流招聘平台公开职位与行业报告的整理估算，随城市、公司和个人表现差异极大；上线前将替换为带出处的当期数据。
    as_of: 2026-09（估算基准，待按最新公开数据核实）
  self_checks:
  - 全力跑一次 3 公里，记录成绩和第二天身体反应
  - 连续 14 天晨起训练，统计自己缺勤次数
  - 高强度训练后对比自己与同伴的恢复速度
  direction_codes: []
  requirements:
  - 无学历门槛，但需比赛成绩作为入场券
  - 建议：田径协会注册或加入俱乐部获得参赛通道
  - 身体条件评估（心肺/肌腱/恢复）决定上限，宜早测试
- code: surgeon
  name: 外科医生
  tagline: 精细、冷静、以十年计的修行
  description: 以手术为核心诊疗手段的医生方向。对手稳、专注、抗压和长期学习的要求全行业最高，回报与资历强挂钩。
  weights:
    precision: 0.3
    focus: 0.2
    logical: 0.2
    resilience: 0.15
    empathy: 0.1
    technical: 0.05
  training_path:
  - stage: 入门验证
    duration: 1-2 个月
    actions:
    - 确认医学路径的现实门槛（高考/考研分数线、学制 5+3）
    - 用缝合练习垫或筷子夹豆测试手部精细能力
    - 连续 2 小时不看手机完成一份长材料的精读与复述
    checkpoint: 精细练习有进步曲线且能接受长学制
  - stage: 基础训练
    duration: 5-8 年
    actions:
    - 完成医学学历与执业医师考试
    - 规培期间争取多上手换药/拉钩/二助
    - 练习打结缝合到形成肌肉记忆
    checkpoint: 规培考核良好、获得导师认可
  - stage: 进阶
    duration: 3-5 年
    actions:
    - 选定亚专科（骨科/普外/神外等）
    - 主刀常见术式并建立手术记录库
    - 参加病例比赛或发表临床文章
    checkpoint: 能独立主刀基础术式
  - stage: 职业化
    duration: 5 年+
    actions:
    - 攻关三四级手术
    - 建立区域内的影响力（会诊/带教）
    checkpoint: 成为科室骨干或学科后备
  income:
    entry: 10-20 万（规培/住院医师阶段，各地差异大）
    mid: 25-60 万（主治/副主任医师，含绩效）
    top: 80-200 万+（知名专家/科室主任，头部民营与多点执业更高）
    note: 回报后置：前 8-10 年收入平平；行情与医院等级、手术量、地区强相关。
    source: 收入区间为 2025-2026 年主流招聘平台公开职位与行业报告的整理估算，随城市、公司和个人表现差异极大；上线前将替换为带出处的当期数据。
    as_of: 2026-09（估算基准，待按最新公开数据核实）
  self_checks:
  - 非惯用手连续 5 分钟用筷子夹黄豆，统计掉落次数
  - 完成一幅细致的手绘或模型拼装，请别人评价精细度
  - 体验一次连续 3 小时的学习/操作，记录中途走神次数
  direction_codes: []
  requirements:
  - 硬门槛：医学院本科（5 年）+ 规培（3 年）+ 执业医师资格
  - 需通过高考/考研进入医学院，分数要求高
  - 职业路径长，需家庭经济与时间上的长期支持
- code: teaching
  name: 教师 / 培训
  tagline: 把别人教会的成就感，是可以做一辈子的事业
  description: 面向一个人的表达、课程设计与对学生的洞察。体制内稳定，培训行业收入弹性大。
  weights:
    verbal: 0.25
    empathy: 0.2
    organization: 0.2
    logical: 0.15
    focus: 0.1
    creative: 0.1
  training_path:
  - stage: 入门验证
    duration: 2-4 周
    actions:
    - 把一个知识点讲给完全外行并录音回听
    - 找 2-3 个真实学员（弟妹/同学）辅导 3 次
    - 尝试把一次讲解剪成 3 分钟短视频
    checkpoint: 学员反馈"听懂了"且你享受过程
  - stage: 基础训练
    duration: 3-6 个月
    actions:
    - 考取对应学段教师资格证（如走体制内）
    - 完整设计一门 10 节的小课并试讲
    - 做兼职家教或机构助教
    checkpoint: 有 3 个以上学员的完整进步记录
  - stage: 进阶
    duration: 1 年
    actions:
    - 形成自己的课程体系与讲义模板
    - 直播/录播试水扩大影响
    - 收集学员反馈迭代教学法
    checkpoint: 续报率或转介绍成为主要生源
  - stage: 职业化
    duration: 2 年+
    actions:
    - 选定学科/人群/形式（K12/成人/企业培训）深耕
    - 体制内评职称或机构做主讲/主理人
    checkpoint: 收入主要来自教学口碑
  income:
    entry: 8-15 万（新教师/助教）
    mid: 15-35 万（成熟教师/机构主讲）
    top: 80-300 万+（头部名师、知识博主、独立培训师）
    note: 培训行业受政策周期影响大（参考双减）；体制内稳定但收入曲线平缓。
    source: 收入区间为 2025-2026 年主流招聘平台公开职位与行业报告的整理估算，随城市、公司和个人表现差异极大；上线前将替换为带出处的当期数据。
    as_of: 2026-09（估算基准，待按最新公开数据核实）
  self_checks:
  - 给完全不懂的人讲清一个概念，看对方能否复述
  - 把同一内容讲三遍，对比第三遍比第一遍进步多少
  - 辅导一个人两周，观察自己是否对对方的进步感到兴奋
  direction_codes:
  - expression
  - organization
  requirements:
  - 体制内需教师资格证 + 相应学历（通常本科起）
  - 培训机构/知识付费无证书硬门槛，重教学效果
  - 建议：一份学员进步记录是最佳敲门砖
- code: programming
  name: 软件开发 / 程序员
  tagline: 把想法变成能跑的东西，市场需求长期存在
  description: 用代码构建软件系统。逻辑与技术主导，入行路径清晰，是自学成才比例最高的技术行业。
  weights:
    logical: 0.3
    technical: 0.25
    focus: 0.2
    creative: 0.15
    organization: 0.1
  training_path:
  - stage: 入门验证
    duration: 4 周
    actions:
    - 选 Python 或 JavaScript 完成入门教程
    - 独立写一个解决自己日常问题的小工具
    - 体验一次连续 2 小时的调试并记录心情
    checkpoint: 调试时是"较劲"而不是"烦躁"
  - stage: 基础训练
    duration: 3-6 个月
    actions:
    - 系统学习数据结构与基础算法
    - 完成 2 个可以给别人用的完整项目
    - 学会用 Git 与写技术文档
    checkpoint: 项目能跑且有人真的在用
  - stage: 进阶
    duration: 6-12 个月
    actions:
    - 选定方向（前端/后端/数据/AI 应用）深入
    - 参与开源项目或接一个小外包
    - 刷面试题并模拟技术面试
    checkpoint: 通过技术面试或收到外包报酬
  - stage: 职业化
    duration: 1 年+
    actions:
    - 入行后按"业务深度×技术深度"双线积累
    - 三年后选择专家线或管理线
    checkpoint: 独立负责一个模块或小团队
  income:
    entry: 15-35 万（应届/转正 1 年内，一二线）
    mid: 30-70 万（3-5 年，大厂或核心业务更高）
    top: 100-300 万+（头部架构师/技术专家/大厂高 P）
    note: 行情与周期强相关（近两年初级岗位竞争加剧）；AI 工具正在抬高门槛但未消除需求。
    source: 收入区间为 2025-2026 年主流招聘平台公开职位与行业报告的整理估算，随城市、公司和个人表现差异极大；上线前将替换为带出处的当期数据。
    as_of: 2026-09（估算基准，待按最新公开数据核实）
  self_checks:
  - 跟着教程写一个 100 行的小程序，统计卡住几次、每次怎么解决
  - 给同事写一份"如何用某工具"的步骤文档，看对方能否照做成功
  - 连续 30 天每天 1 小时编码，记录缺勤天数
  direction_codes:
  - coding
  - analysis
  requirements:
  - 无学历硬门槛（大厂除外），作品与项目经验说话
  - 建议：一个完整可用的项目仓库 + 技术博客
  - 算法面试是主要关卡，需 2-3 个月刻意准备
- code: design
  name: 设计 / 创意
  tagline: 用作品说话，审美就是生产力
  description: 平面、UI、产品、空间等创意方向。作品集重于学历，审美与迭代能力决定天花板。
  weights:
    creative: 0.4
    focus: 0.15
    empathy: 0.1
    technical: 0.1
    verbal: 0.1
    logical: 0.15
  training_path:
  - stage: 入门验证
    duration: 2-4 周
    actions:
    - 每天临摹一个喜欢的作品并记录差异
    - 完成一个真实小需求（帮朋友做海报/名片）
    - 收集 50 个让你"哇"的作品建灵感库
    checkpoint: 临摹能接近原作且过程不觉得苦
  - stage: 基础训练
    duration: 3-6 个月
    actions:
    - 系统学一套工具（Figma/PS/AI 绘图任选）
    - 掌握版式、色彩、字体三件套基础
    - 完成 3 个带完整需求背景的作品
    checkpoint: 有了能拿出手的第一个作品集雏形
  - stage: 进阶
    duration: 6-12 个月
    actions:
    - 接真实委托（哪怕低价）积累客户反馈
    - 学习设计方法论（用户调研/可用性）
    - 参加比赛或设计社区持续输出
    checkpoint: 有客户为你的方案付过钱
  - stage: 职业化
    duration: 1 年+
    actions:
    - 选定细分（品牌/UI/插画/空间）建立个人风格
    - 走公司路线或独立设计师路线
    checkpoint: 作品集能通过目标公司/客户筛选
  income:
    entry: 8-20 万（初级设计师）
    mid: 20-50 万（成熟设计师/小团队负责人）
    top: 80-300 万+（知名设计总监/头部独立设计师/爆款 IP 作者）
    note: 接单市场受经济周期影响明显；个人风格与客户资源是收入的分水岭。
    source: 收入区间为 2025-2026 年主流招聘平台公开职位与行业报告的整理估算，随城市、公司和个人表现差异极大；上线前将替换为带出处的当期数据。
    as_of: 2026-09（估算基准，待按最新公开数据核实）
  self_checks:
  - 把同一个需求做三版完全不同的方案，看能否做到
  - 请 3 个人指出你作品的问题，观察你是否愿意推翻重做
  - 临摹一幅喜欢的作品，对照找出 10 处差异
  direction_codes:
  - design
  requirements:
  - 无证书门槛，作品集就是简历
  - 建议：5 个带完整需求背景的作品 > 任何证书
  - 工具熟练度是入场券（Figma/PS 任选其一精通）
- code: entrepreneurship
  name: 创业 / 经营
  tagline: 收入上限最高，方差也最大
  description: 发现需求、组织资源、承担风险换取回报。考验的是综合素质与心力，而不是单一技能。
  weights:
    resilience: 0.25
    persuasion: 0.2
    organization: 0.2
    logical: 0.15
    numeric: 0.1
    verbal: 0.1
  training_path:
  - stage: 入门验证
    duration: 1 个月
    actions:
    - 用 500 元以内成本做一个微型买卖（进货转卖/代购/服务）
    - 完整算一次账：成本、毛利、时间投入
    - 访谈 5 个潜在买家记录真实需求
    checkpoint: 敢于开口收钱并算得清账
  - stage: 基础训练
    duration: 3-6 个月
    actions:
    - 在职场里争取一条完整业务线（从获客到交付）
    - 学习基础财务：现金流、毛利、复购
    - 找到一位愿意说真话的创业前辈
    checkpoint: 见过完整的"收钱-交付-复盘"循环
  - stage: 进阶
    duration: 1-2 年
    actions:
    - 以副业形式跑通一个最小商业模式
    - 建立第一批稳定客户/用户
    - 练习融资或自筹的现金流管理
    checkpoint: 副业收入连续 6 个月覆盖生活成本的三分之一
  - stage: 职业化
