# 行业潜力测评题库：12 项潜力特质 × 4 题 = 48 题（Likert 1-5）。
# 设计参照成熟问卷的做法（如 IPIP / O*NET Interest Profiler 的结构思路），
# 题目为自编中文题，正式上线前需按 compliance.md 做小样本信度检验。
# reverse: true 的题反向计分（得分 = 6 - 原始分），用于抑制一致作答偏差。

traits:
- code: verbal
  name: 表达沟通
  description: 把事情讲清楚、让人听得进去的能力
  improve:
  - 每天复述一段读到的内容，录音回听删掉废话
  - 每周给一个外行讲清一个概念，收集『哪里没懂』
  - 读一本结构化表达的书（如金字塔原理）并套用 5 次
- code: logical
  name: 逻辑分析
  description: 拆解问题、检查证据、找规律的能力
  improve:
  - 遇到结论先写『证据清单』再下判断
  - 每周做一道逻辑谜题或复盘一个案例
  - 用 5Why 法追问一个日常问题的根因
- code: creative
  name: 审美创造
  description: 对美感与新颖做法的敏感度
  improve:
  - 每天临摹一个喜欢的作品并记录差异
  - 同一需求强迫自己出三个方案再选
  - 建立灵感库：每周收藏 10 个『哇』时刻
- code: technical
  name: 技术动手
  description: 折腾工具、软件、机械并解决问题的倾向
  improve:
  - 每周把一件重复的事自动化一次
  - 遇到软件问题先自己查 20 分钟再求助
  - 学一门入门教程并做出一个能跑的小东西
- code: physical
  name: 身体素质
  description: 体力、耐力与运动恢复能力
  improve:
  - 固定每周 3 次有氧+1 次力量，从低量开始
  - 记录晨脉与睡眠，观察恢复趋势
  - 尝试 2-3 种运动找到不觉得苦的那一种
- code: precision
  name: 精细操作
  description: 手稳、精确、耐得住细节的能力
  improve:
  - 每天 10 分钟精细练习（写字/串珠/模型）
  - 做需要手稳的小活：穿针、剪纸、拆小件
  - 玩需要精准操作的游戏（叠叠乐/夹豆）
- code: empathy
  name: 共情关怀
  description: 察觉他人状态、让人信任的能力
  improve:
  - 对话时先复述对方的话再回应
  - 每周记录一次『对方的情绪是什么、我怎么知道的』
  - 读一本关于倾听的书并演练 2 个技巧
- code: persuasion
  name: 说服进取
  description: 主动争取、不怕拒绝、竞争兴奋度
  improve:
  - 每周主动提出一次请求（从小的开始）
  - 被拒绝后记录一次『下次怎么换说法』
  - 参加一次需要表态或竞争的活动
- code: organization
  name: 统筹组织
  description: 排优先级、理依赖、让事情落地的能力
  improve:
  - 每周日用 30 分钟给下周排优先级
  - 给重复事务写 SOP 清单
  - 接手一次多人活动的统筹
- code: resilience
  name: 抗压韧性
  description: 受挫恢复与长期坚持的倾向
  improve:
  - 把大目标拆成『跳一跳够得着』的小步
  - 每次受挫后写一句『下次的替代做法』
  - 坚持一件小正面事 21 天并打卡
- code: focus
  name: 专注耐心
  description: 长时间投入与重复练习的耐受度
  improve:
  - 从 15 分钟无手机专注开始，每周加 5 分钟
  - 用番茄钟把任务切小并记录完成数
  - 一次只开一个窗口/任务
- code: numeric
  name: 数字敏感
  description: 对数字、账目、投入产出的敏感度
  improve:
  - 记账 30 天，每周做一次小结
  - 看报表先找三个数字的关系再读文字
  - 用 Excel/表格做一个自己关心的计算
