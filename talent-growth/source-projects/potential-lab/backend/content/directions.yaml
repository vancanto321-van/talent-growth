# 天赋方向库（首批 6 个：都能在电脑上完成验证任务；线下方向后续版本再加入）
# signals 供模拟 AI 做访谈信号匹配；正式 AI 由模型自行判断，signals 仍作为提示词参考。
#
# cultivation = 该方向的培养路径（验证通过、决定投入后怎么练），四段式：
#   打基础 → 日常练习 → 进阶 → 组合放大，每段给出具体动作与时间预算。
# everyday_practice = 每周 2-3 次、每次 15 分钟就能做的日常保养动作。

directions:
  - code: expression
    name: 表达与教学
    tagline: 把复杂的事讲清楚，让别人真的听懂
    description: >
      面对不熟悉的人或新领域，能快速组织语言、选对例子、把概念讲明白。
      典型的验证信号：别人听完你的解释会说"懂了"，而且下次能复述。
    signals: [讲, 解释, 教, 辅导, 分享, 写作, 培训, 演讲, 说服, 讲清楚, 通俗]
    cultivation:
      - { stage: 打基础（第 1-4 周）, actions: [每天 15 分钟输入：读一篇好文章并复述给自己听, 每周把一个概念讲给一个外行听并收集反馈, 学习一个基本框架：结论先行/类比/举例子], budget: 每天 15-30 分钟 }
      - { stage: 日常练习（第 2-3 个月）, actions: [每周录一期 3 分钟"小讲堂"视频或音频, 加入一个需要发言的社群（读书会/行业群）, 建立"卡点清单"：记录别人在哪听不懂], budget: 每周 2-3 小时 }
      - { stage: 进阶（第 4-12 个月）, actions: [确定细分场景：技术讲解/知识科普/企业培训, 争取一次 30 分钟以上的正式分享, 找一位表达高手给你做一对一反馈], budget: 每周 3-5 小时 }
      - { stage: 组合放大, actions: [表达×分析 → 咨询/教学内容创作; 表达×设计 → 视觉叙事, 用组合能力做一个完整作品：课程/专栏/分享会], budget: 按项目 }
    everyday_practice:
      - 把今天学到的一件事用三句话讲给家人/同事
      - 读到好文章时，先猜结构再对照原文
      - 收集一个"别人没听懂"的瞬间，想想下次怎么讲

  - code: analysis
    name: 分析与推理
    tagline: 从一堆材料里找出问题、理清因果
    description: >
      面对混乱的信息，能快速抓住关键、发现矛盾、把原因和结果排清楚。
      典型的验证信号：你指出的问题后来被证实，或你的判断比别人更早接近真相。
    signals: [分析, 推理, 找问题, 逻辑, 拆解, 研究, 数据, 原因, 规律, 挑错, 复盘]
    cultivation:
      - { stage: 打基础（第 1-4 周）, actions: [学一个分析框架并套用 5 次（5Why/ MECE/ 因果链）, 每周对一篇新闻或报告写 200 字"问题与依据", 建立自己的"判断记录本"：预测+依据+结果], budget: 每天 15-30 分钟 }
      - { stage: 日常练习（第 2-3 个月）, actions: [每周完整分析一个真实案例（公司/产品/事件）, 和朋友做"观点对抗"：故意反驳自己一次, 学习基础数据工具（Excel 函数或 SQL 入门）], budget: 每周 2-3 小时 }
      - { stage: 进阶（第 4-12 个月）, actions: [选定一个领域深耕（行业分析/用户研究/故障排查）, 输出一份完整分析报告并请专家挑错, 回看 3 个月前的判断，标注准确率], budget: 每周 3-5 小时 }
      - { stage: 组合放大, actions: [分析×表达 → 咨询/教学; 分析×编程 → 数据方向, 把分析方法写成可复用的清单或模板], budget: 按项目 }
    everyday_practice:
      - 看到任何结论先问一句：证据是什么
      - 每天给一个现象找至少两种解释
      - 记录一个自己判断错的地方，分析错在哪

  - code: design
    name: 设计与创造
    tagline: 面对同一个需求，总能拿出不一样的方案
    description: >
      对美感、结构、体验敏感，能把模糊的想法变成具体可看的东西。
      典型的验证信号：你的方案和别人明显不同，而且别人愿意直接采用。
    signals: [设计, 画, 排版, 审美, 做东西, 创意, 海报, 配色, 手工, 装修, 布局]
    cultivation:
      - { stage: 打基础（第 1-4 周）, actions: [每天临摹一个喜欢的作品并记录 3 处差异, 建立灵感库（收藏 50 个"哇"时刻）, 学一套工具基础（Figma/PS/手绘任选）], budget: 每天 20-30 分钟 }
      - { stage: 日常练习（第 2-3 个月）, actions: [每周完成一个真实小委托（海报/名片/页面）, 练"三方案"习惯：同一需求逼自己出 3 版, 学版式三件套：对齐/对比/留白], budget: 每周 2-3 小时 }
      - { stage: 进阶（第 4-12 个月）, actions: [确定细分：品牌/UI/插画/空间, 做一份 5 个作品的完整作品集, 找真实用户测试你的设计并迭代一轮], budget: 每周 3-5 小时 }
      - { stage: 组合放大, actions: [设计×编程 → 独立产品; 设计×表达 → 视觉叙事, 参加一次设计比赛或公开发布作品集], budget: 按项目 }
    everyday_practice:
      - 看到"哇"的设计随手存进灵感库
      - 给身边任意一样东西挑一个设计毛病
      - 用 10 分钟画一个日常小物件的三种改法

  - code: coding
    name: 编程与自动化
    tagline: 让机器替人重复干活，把想法做成能跑的东西
    description: >
      能把一个具体问题变成程序或自动化流程，遇到报错愿意一点点调通。
      典型的验证信号：你做出的东西有人真的在用，或你调试的坚持度明显高于常人。
    signals: [代码, 编程, 脚本, 程序, 自动化, excel, python, 函数, 软件, 电脑, 折腾]
    cultivation:
      - { stage: 打基础（第 1-4 周）, actions: [选 Python 或 JavaScript 完成入门教程, 独立写第一个解决自己麻烦的小脚本, 学会看报错信息：从最后一行往上读], budget: 每天 30 分钟 }
      - { stage: 日常练习（第 2-3 个月）, actions: [每周解决一个自己的真实小麻烦, 学 Git 管理代码，把脚本都放进仓库, 阅读一段别人的代码并模仿写法], budget: 每周 3-4 小时 }
      - { stage: 进阶（第 4-12 个月）, actions: [选定方向深入（自动化/数据/Web/AI 应用）, 做一个别人真的在用的完整小工具, 参与开源或接一个小外包], budget: 每周 4-6 小时 }
      - { stage: 组合放大, actions: [编程×设计 → 独立开发; 编程×分析 → 数据方向, 把工具做成产品：文档+示例+使用反馈], budget: 按项目 }
    everyday_practice:
      - 遇到重复第三遍的事，想一句"能不能自动化"
      - 每周读 20 行别人的代码，弄懂每一行
      - 记录一次调试：卡在哪、试了什么、怎么通的

  - code: organization
    name: 组织与规划
    tagline: 把模糊的大目标拆成能落地的一步步
    description: >
      面对没头绪的任务，能排出优先级、看清依赖、预留变化的空间。
      典型的验证信号：按你的计划推进的事，真的能按时做完，出变化时你有备用路径。
    signals: [计划, 组织, 安排, 拆解, 统筹, 排期, 清单, 管理, 流程, 优先级, 效率]
    cultivation:
      - { stage: 打基础（第 1-4 周）, actions: [给自己的每周目标做一次正式拆解（目标→任务→顺序）, 学习一个方法：四象限/甘特图/OKR 任选, 给一次家庭或朋友活动做完整统筹], budget: 每天 15 分钟 }
      - { stage: 日常练习（第 2-3 个月）, actions: [每周做一次"计划-执行-复盘"闭环, 为别人拆一次目标（朋友的目标当案例）, 建立 SOP 习惯：重复的事写成清单], budget: 每周 2 小时 }
      - { stage: 进阶（第 4-12 个月）, actions: [负责一个有多人/多步骤的真实项目, 练"变更管理"：计划被打乱后的重排能力, 用数据复盘：预估耗时 vs 实际耗时], budget: 每周 3-4 小时 }
      - { stage: 组合放大, actions: [统筹×人际 → 项目管理/运营; 统筹×分析 → 流程优化, 把你的排期模板教给团队里的人], budget: 按项目 }
    everyday_practice:
      - 每天早上写下今天最重要的三件事
      - 接到模糊任务时，先画"依赖关系"再动手
      - 周五花 15 分钟复盘：计划 vs 实际

  - code: interpersonal
    name: 人际协作
    tagline: 让不同的人愿意一起把事做成
    description: >
      能察觉别人的状态和顾虑，会调解分歧、组织协作，让人信任你。
      典型的验证信号：发生分歧时大家愿意听你的，你组队做的事别人愿意再来。
    signals: [帮忙, 调解, 倾听, 安慰, 组队, 协调, 交朋友, 团队, 聊, 疏导, 张罗]
    cultivation:
      - { stage: 打基础（第 1-4 周）, actions: [练"复述式倾听"：先复述对方的话再回应, 每周一次深度对话：只提问不给建议, 读一本沟通经典并挑 2 个技巧演练], budget: 每天 15 分钟 }
      - { stage: 日常练习（第 2-3 个月）, actions: [主动发起一次多人协作并负责跟进, 每周复盘一次人际互动：各方的真实诉求是什么, 练"难话说出口"：练习提不同意见而不伤人], budget: 每周 2 小时 }
      - { stage: 进阶（第 4-12 个月）, actions: [组织一个定期的小团体（读书会/球队/学习小组）, 学习一个框架：非暴力沟通/利益型谈判, 帮助两个人解决他们之间的分歧], budget: 每周 2-3 小时 }
      - { stage: 组合放大, actions: [协作×统筹 → 项目管理/运营; 协作×表达 → 培训/教练, 把你的协作经验整理成团队约定], budget: 按项目 }
    everyday_practice:
      - 每天对一个人说出你观察到的他的情绪
      - 开会时练习最后一个发言（先听完所有人）
      - 记录一次"说服成功"，分析为什么成了

  # everyday_practice 与 cultivation 的使用位置：
  # cultivation 显示在「画像」页方向卡片的"培养路径"展开区；
  # everyday_practice 显示在同一展开区底部，作为轻量日常动作。
