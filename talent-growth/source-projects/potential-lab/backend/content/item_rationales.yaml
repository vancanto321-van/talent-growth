# 出题理由库：每一道题"为什么这么问"。
# 结构与题库对应：interview → 访谈题；assessment → 成人行业测评题；child → 儿童版两套题。
# 内容加载时按 code 合并进题目数据，前端可展开展示。

interview:
  q_learn_fast: 问"具体哪件事学得顺"，用的是行为事件访谈法（McClelland，哈佛）的思路：过去的真实行为比自我评价可靠。同时追问"之前有多少基础"，是为了把"学得快"和"只是练得多"区分开——前者更像潜力信号。
  q_asked_for_help: 别人主动来找的忙，是外部给出的信号，受"自我美化"的影响最小；追问具体成果，对应关键事件法（Flanagan）的要求——只要可验证的行为结果，不要抽象印象。
  q_repeat_willingly: 问"愿意反复做 + 受挫后还想继续"，测的是内在坚持倾向，也是宾大 Duckworth"毅力"两要素（努力坚持 + 兴趣一致）的行为化问法。
  q_lose_track: 借用心流理论（Csikszentmihalyi）：忘记时间通常意味着任务难度与你的能力刚好匹配。追问做完是满足还是疲惫，用来区分"真喜欢"和"一时新鲜"。
  q_untried: 给"没机会接触的方向"留入口——问卷只能反映过去的机会，不能定义未来的可能。这道题的答案会用于安排低成本的体验任务。
  q_time_budget: 这道题不判断方向，只用于把计划排得现实可行。研究一再表明，超出时间预算的计划注定失败，失败体验会毁掉整个探索过程。

assessment:
  v1: 核心表达能力的最直接行为指标——教学与讲解的本质是"让没有背景的人理解"，而不是自己会说。
  v2: 他人主动推举你做解释，是同伴提名式的行为证据：比"我觉得我表达好"更难伪装、更可信。
  v3: 反向题。捕捉"心里明白但表达失灵"的情况，用来抑制一律答"像我"的作答惯性，提高问卷可信度。
  v4: 他人遇到问题第一个来问你——"被依赖度"信号，说明你的解释在实际场景里被验证过有效。
  l1: 拆解问题找根因，是分析能力的核心动作，对应 RIASEC 研究型维度（Holland）最典型的日常行为。
  l2: '看到结论先查证据"是批判性思维的最小行为单元：结论—证据的链接意识。'
  l3: 反向题。识别纯直觉型作答习惯，与 l1/l2 交叉验证分析习惯是否真实存在。
  l4: 推理解谜游戏表现，是低压力情境下的推理速度参考——游戏情境里没人想"表现好"，伪装动机最低。
  c1: 审美敏感度的最基础指标：能"辨别"先于会"创作"，几乎所有创意领域的第一道门槛。
  c2: '总想换新做法"是创造性的稳定人格侧信号：对常规的不满足感（创新倾向）。'
  c3: 反向题。核查审美敏感度是否真的缺失，与 c1/c4 交叉验证。
  c4: 想给作品加个人风格，是创造性表达的稳定冲动——风格化是创作者区别于模仿者的标志。
  t1: '出问题先自己捣鼓"是技术自我效能的经典行为指标，行话叫工具韧性。'
  t2: 做过自动化小工具，是从"会用工具"到"会造工具"的分水岭——编程潜力的关键行为证据。
  t3: 反向题。核查面对技术文档时的耐挫性，与 t1/t4 交叉验证。
  t4: 拆装与改配置的自信心，反映动手探索的意愿基线。
  ph1: '比同龄人轻松"用同伴作参照系，比绝对成绩更能降低自我高估。'
  ph2: 运动后恢复速度，是运动潜力的关键生理信号——它比单次成绩稳定，受训练量影响小。
  ph3: 反向题。核查有氧耐受的真实下限。
  ph4: 活动水平基线（能量气质）：天生的精力水平是耐力项目选拔最看重的特质之一。
  pr1: 手稳是精细操作的核心指标——外科、工艺、乐器的共同门槛。
  pr2: 长时间精确动作不疲劳，区分"能做一次"和"能做一天"，职业场景要的是后者。
  pr3: 反向题。核查动作控制的真实水平。
  pr4: 一眼看到细节瑕疵，是"注意细节"素质——质检、手术、法律审阅的共同要求。
  e1: 第一个察觉别人情绪不好，是情绪觉察力——共情的入口（情绪智力框架的第一步）。
  e2: 别人有心事愿意对你说，是被信任度的行为证据：关系质量比社交技巧更根本。
  e3: 反向题。核查倾听意愿，排除"人缘好但共情弱"的情况。
  e4: 能读出言不由衷，是情绪理解的深度指标：听到台词之下的情绪。
  pe1: 说服别人带来兴奋感而非焦虑，是说服动机健康的信号（进取性的积极面）。
  pe2: 主动争取、不怕被拒，是销售与商务岗的核心行为指标——被拒韧性。
  pe3: 反向题。核查自我主张的真实水平。
  pe4: 竞争场合状态更好，说明压力唤起对你是"挑战反应"而非"威胁反应"——运动与竞赛心理学的关键区分。
  o1: 没人要求就开始排时间表和分工，是统筹能力的自发倾向——最有诊断价值的信号。
  o2: 多任务下排出先后，是优先级判断：管理认知的核心动作。
  o3: 反向题。核查计划完备性的真实水平。
  o4: 出行聚会常由你安排，是同伴推举的组织角色证据（与 o1 互为验证）。
  r1: 搞砸后能重新开始，是恢复力的最小行为单元。
  r2: 截止日前反而更专注，说明压力唤起对你有增益作用——高压力职业的适配信号。
  r3: 反向题。核查对社会评价的敏感度，识别需要心理建设支持的情况。
  r4: 长期看不到成果仍坚持，对应"毅力"的一致性要素（Duckworth）：延迟满足的日常表现。
  f1: 长时间专注坐得住，是专注耐力基线——几乎所有深度技能的前置条件。
  f2: 不觉得重复练习苦，是刻意练习（Ericsson）的耐受度：通往专家水平的必要非充分条件。
  f3: 反向题。核查专注力的真实水平。
  f4: 做完才休息，是完成倾向（闭合需求）的行为面——项目型工作的关键素质。
  n1: 找数字规律，是数字模式识别的最基础指标。
  n2: 记账比价又快又准，测日常数字应用能力——比抽象数学测验更贴近真实工作场景。
  n3: 反向题。核查数字亲和度的真实水平。
  n4: 决策前算投入产出，是量化决策习惯——金融、经营、工程思维的共同日常。

child:
  parent:
    pl1: 复述细节是语言理解+记忆+表达的复合行为，比"爱说话"更能说明语言潜能。
    pl2: 词汇量是语言能力的最稳定预测指标之一，且容易和家长记忆中的对照（同龄孩子）比较。
    pl3: 编故事、给玩偶配音是"语言生成"行为——从听懂、会说升级到能创造。
    pl4: 对文字符号的早期敏感，是阅读潜能的典型早期信号。
    pl5: 能把想法讲清楚，是语言能力的实用面：表达最终要为沟通服务。
    pq1: 连环追问"为什么"是求知欲与因果思维的自发行为，逻辑型孩子最典型的日常表现。
    pq2: 拼图、棋类、找规律都是规则系统游戏，玩得好说明规则思维在线。
    pq3: 数数与比大小的早晚，是数感发展的常见观察点。
    pq4: 自发分类排序，是归纳与秩序感的行为化表现。
    pq5: 能发现"不对劲"，说明孩子在主动做一致性检查——批判性思维的萌芽。
    ps1: 搭积木"有自己的结构"，观察的是空间规划而不只是动手。
    ps2: 画面的细节与布局，反映空间组织与观察力。
    ps3: 认路、看地图需要在大脑里建立空间关系，是空间智能的经典观察点。
    ps4: 拼图速度是空间图形旋转与匹配能力的日常指标。
    ps5: 对颜色形状敏感、爱拆装，是空间好奇心的双重信号。
    pm1: 听两遍就能哼，是旋律记忆——音乐潜能最容易被家长观察到的一项。
    pm2: 音准与节奏是音乐能力的两块基石，先看节奏。
    pm3: 听到音乐身体跟着动，是节奏感受性的自发表现（不训练也看得出来）。
    pm4: 对乐器的好奇心，是音乐兴趣强度的信号。
    pm5: 能听出跑调，是"音乐辨别力"——辨别先于演奏。
    pb1: 跑跳攀爬等大动作发展水平，是身体潜能的基础观察项。
    pb2: 学新动作快，反映动作协调性与运动学习能力。
    pb3: 精力旺盛坐不住，在低龄段是能量气质的信号（不是缺点）。
    pb4: 用剪刀、串珠等精细动作，与身体大动作分开观察——两条不同的发展线。
    pb5: 对户外与体育的自发偏好，是运动动机的直接信号。
    pi1: 主动交朋友，是社交主动性——社交能力里最容易观察的一项。
    pi2: 察觉并安慰他人情绪，是共情的行为化观察点。
    pi3: 能调解同伴矛盾，是高于同龄人的社交复杂度处理能力。
    pi4: 喜欢组织大家玩，是"孩子王"的组织倾向。
    pi5: 大人觉得"会来事"，是跨年龄社交适应力的外部评价。
    pn1: 独处自得其乐，是内省型孩子的典型特征——独处质量比独处时长更说明问题。
    pn2: 能说出自己的优缺点，是自我认识（元认知）发展的早期标志。
    pn3: 情绪平复后能讲出原因，是情绪理解与语言化能力。
    pn4: 有主见不跟风，是独立判断的萌芽。
    pn5: 喜欢安静的深度活动，是内省型孩子偏好的活动模式信号。
    pa1: 对动植物观察入微，是自然观察智能的核心行为。
    pa2: 记住大量名字（恐龙/车/花），是分类记忆能力——自然观察者的典型童年特征。
    pa3: 对天气季节敏感，是环境觉察力。
    pa4: 收集行为，是观察-积累-分类这一研究者行为链的起点。
    pa5: 户外时专注度上升，说明自然环境是这类孩子的最佳学习情境。
    pg1: '遇难题多试几次"是毅力（grit）的"努力坚持"要素（宾大 Duckworth 框架）的儿童行为化。'
    pg2: 有始有终，是毅力的另一要素"兴趣一致性"的行为面。
    pg3: 失败后能重来，测的是挫折恢复——预测长期学习比智商更有效的变量之一。
    pg4: 能等待和攒努力，是延迟满足的经典观察点。
    pd1: 相信"练了会变好"，是成长型思维的核心信念（斯坦福 Dweck）。
    pd2: 失败后换办法，是成长型思维的行为面：把失败当信息而非判决。
    pd3: 主动挑战新任务，是思维模式健康度的最直接行为证据。
    pd4: 不怕当众出错，反映的是"错误=学习机会"的内化程度。
  self:
    sl1: 复述故事考察语言理解、记忆与表达的复合能力。
    sl2: 词汇量是语言能力的稳定指标，孩子自己也能感知到。
    sl3: 编故事、配音是语言生成行为——从会说升级到能创造。
    sl4: 主动想知道新词的意思，是文字敏感度的自发信号。
    sl5: 把事情讲明白，是语言能力的实用面。
    sq1: 爱问为什么，是因果思维与求知欲的自发行为。
    sq2: 规则类游戏玩得好，说明规则思维在线。
    sq3: 心算快慢，是数感的日常观察点。
    sq4: 喜欢分类整理，是归纳与秩序感的表现。
    sq5: 能发现别人说法的漏洞，是一致性检查——批判性思维的萌芽。
    ss1: 搭积木有自己的设计，观察的是空间规划能力。
    ss2: 画面的细节与布局，反映空间组织力。
    ss3: 认路看地图，需要在脑中建立空间关系——空间智能经典观察点。
    ss4: 拼图快，是图形旋转与匹配能力的日常指标。
    ss5: 爱拆装研究，是空间好奇心的直接表现。
    sm1: 听两遍能哼，是旋律记忆——音乐潜能最易自察的一项。
    sm2: 音准节奏，是音乐能力的两块基石。
    sm3: 跟着音乐动起来，是节奏感受性的自发表现。
    sm4: 想学乐器或爱节奏游戏，是音乐兴趣强度信号。
    sm5: 能听出跑调，是音乐辨别力——辨别先于演奏。
    sb1: 跑跳爬都行，是身体素质的基础面。
    sb2: 新动作看一遍会大概，是运动学习能力的自察。
    sb3: 久坐难受，是能量气质的信号（不是缺点）。
    sb4: 手工精巧，是精细动作线——和大动作分开观察。
    sb5: 最喜欢上体育课，是运动动机的直接信号。
    si1: 主动交朋友，是社交主动性。
    si2: 能发现并安慰同学，是共情的行为化表现。
    si3: 常常能劝好吵架，是处理社交复杂度的能力。
    si4: 玩什么怎么玩由你组织，是组织者角色信号。
    si5: 老师同学愿意打交道，是社交适应的外部评价。
    sn1: 独处也有意思，是内省型孩子的典型特征。
    sn2: 说得出自己的优缺点，是自我认识（元认知）的标志。
    sn3: 能说清为什么生气，是情绪理解与表达能力的进阶体现。
    sn4: 有自己的想法，是独立判断的萌芽。
    sn5: 喜欢安静看书想事情，是内省型孩子的活动偏好。
    sa1: 对动植物观察细，是自然观察智能的核心行为。
    sa2: 记得住大量名字，是分类记忆——自然观察者的典型特征。
    sa3: 对天气季节敏感，是环境觉察力。
    sa4: 喜欢收集小东西，是观察-积累-分类行为链的起点。
    sa5: 户外来劲、观察多，说明自然是你的最佳学习情境。
    sg1: 难题多试几次，是毅力"努力坚持"要素（宾大 Duckworth 框架）的自答版。
    sg2: 做事有头有尾，是毅力"兴趣一致性"的行为面。
    sg3: 输了能再来，测挫折恢复力。
    sg4: 慢慢攒慢慢等，是延迟满足的自答版。
    sd1: 相信多练会变好，是成长型思维的核心信念（斯坦福 Dweck）。
    sd2: 失败换办法，是把失败当信息而非判决的行为面。
    sd3: 喜欢挑战新任务，是思维模式健康度的直接证据。
    sd4: 不怕当众出错，反映"错误=学习机会"的内化程度。
