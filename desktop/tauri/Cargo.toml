[package]
name = "talent-growth-desktop"
version = "0.1.0"
description = "天赋生长桌面应用壳"
authors = ["天赋生长"]
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "talent_growth_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
